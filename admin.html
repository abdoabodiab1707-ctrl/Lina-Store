<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Lina Store - Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7f8;
color:#222;
}

header{
background:#111827;
color:white;
padding:20px;
}

header h1{
margin:0;
font-size:24px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px;
}

.stat{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 12px #00000012;
}

.stat strong{
display:block;
font-size:28px;
margin-top:8px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 12px #00000012;
}

.order{
border:1px solid #eee;
border-radius:12px;
padding:15px;
margin-top:12px;
}

.order h3{
margin:0 0 8px;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.badge{
background:#fff0f6;
color:#d63384;
padding:5px 10px;
border-radius:20px;
font-size:13px;
}

.status{
background:#fff7ed;
color:#c2410c;
padding:5px 10px;
border-radius:20px;
font-size:13px;
}

.statusSelect{
border:1px solid #e5e7eb;
border-radius:10px;
padding:7px 10px;
background:#fff;
font-family:inherit;
font-weight:bold;
}

.whatsappBtn{
background:#22c55e;
color:white;
margin-right:6px;
}
button{
border:0;
border-radius:10px;
padding:10px 15px;
cursor:pointer;
font-weight:bold;
}

.refresh{
background:#ec4899;
color:white;
}

.clear{
background:#ef4444;
color:white;
}

.logout{
background:#ef4444;
color:white;
}

.loginBox{
max-width:450px;
margin:50px auto;
}

input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
margin-top:7px;
margin-bottom:15px;
font-size:16px;
}

.loginBtn{
width:100%;
background:#ec4899;
color:white;
font-size:16px;
padding:13px;
}

.empty{
text-align:center;
padding:30px;
color:#777;
}

.error{
background:#fee2e2;
color:#b91c1c;
padding:12px;
border-radius:10px;
margin-bottom:15px;
}

.success{
background:#dcfce7;
color:#166534;
padding:12px;
border-radius:10px;
margin-bottom:15px;
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr;
}

.container{
padding:12px;
}

}

</style>

</head>

<body>

<header>

<div class="container">

<div class="row">

<div>

<h1>🛍️ Lina Store — لوحة التحكم</h1>

<p style="margin-bottom:0">
إدارة ومتابعة طلبات المتجر
</p>

</div>

<div id="headerButton"></div>

</div>

</div>

</header>


<main class="container">

<div id="app">

<div class="card loginBox">

<h2>🔐 دخول لوحة الإدارة</h2>

<p>
من فضلك سجل الدخول بحساب الأدمن.
</p>

<div id="loginMessage"></div>

<label>
البريد الإلكتروني
</label>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني"
autocomplete="email"
>

<label>
كلمة المرور
</label>

<input
id="password"
type="password"
placeholder="كلمة المرور"
autocomplete="current-password"
>

<button
class="loginBtn"
onclick="loginAdmin()">

تسجيل الدخول

</button>

</div>

</div>

</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
"https://kuuknnnvukdcbmcgntby.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Q5WB5WPKJsNSSHjl2Eg_tw_JRZfd_rW";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const COUNTRIES={

USA:{
name:"🇺🇸 الولايات المتحدة",
symbol:"$"
},

KWT:{
name:"🇰🇼 الكويت",
symbol:"د.ك"
},

KSA:{
name:"🇸🇦 السعودية",
symbol:"ر.س"
},

UAE:{
name:"🇦🇪 الإمارات",
symbol:"د.إ"
},

EGY:{
name:"🇪🇬 مصر",
symbol:"ج.م"
}

};


function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


async function loginAdmin(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

const message=
document.getElementById("loginMessage");

if(!email || !password){

message.innerHTML=`
<div class="error">
من فضلك اكتب البريد الإلكتروني وكلمة المرور.
</div>
`;

return;

}


message.innerHTML=`
<div class="success">
جاري تسجيل الدخول...
</div>
`;


const {data,error}=
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});


if(error){

message.innerHTML=`
<div class="error">
فشل تسجيل الدخول:
${escapeHtml(error.message)}
</div>
`;

return;

}


await checkAdmin();

}


async function checkAdmin(){

const {
data:{
user
}
}=await supabaseClient.auth.getUser();


if(!user){

showLogin();

return;

}


const {
data:profile,
error
}=await supabaseClient
.from("profiles")
.select("role")
.eq("id",user.id)
.maybeSingle();


if(error){

console.error(error);

await supabaseClient.auth.signOut();

showLogin("حدث خطأ أثناء التحقق من صلاحيات الأدمن.");

return;

}


if(!profile || profile.role!=="admin"){

await supabaseClient.auth.signOut();

showLogin("هذا الحساب ليس لديه صلاحية الأدمن.");

return;

}


showDashboard();

loadOrders();

}


function showLogin(message=""){

document.getElementById("headerButton").innerHTML="";

document.getElementById("app").innerHTML=`

<div class="card loginBox">

<h2>🔐 دخول لوحة الإدارة</h2>

<p>
من فضلك سجل الدخول بحساب الأدمن.
</p>

<div id="loginMessage">

${message ? `
<div class="error">
${escapeHtml(message)}
</div>
` : ""}

</div>

<label>
البريد الإلكتروني
</label>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني"
autocomplete="email"
>

<label>
كلمة المرور
</label>

<input
id="password"
type="password"
placeholder="كلمة المرور"
autocomplete="current-password"
>

<button
class="loginBtn"
onclick="loginAdmin()">

تسجيل الدخول

</button>

</div>

`;

}


function showDashboard(){

document.getElementById("headerButton").innerHTML=`

<button
class="logout"
onclick="logoutAdmin()">

🚪 تسجيل الخروج

</button>

`;


document.getElementById("app").innerHTML=`

<div class="stats">

<div class="stat">

📦 الطلبات

<strong id="ordersCount">
0
</strong>

</div>


<div class="stat">

💰 آخر إجمالي بالدولار

<strong id="lastTotal">
0 $
</strong>

</div>


<div class="stat">

🌍 آخر دولة

<strong id="lastCountry">
-
</strong>

</div>

</div>


<div class="card">

<div class="row">

<h2>
📋 الطلبات
</h2>

<button
class="refresh"
onclick="loadOrders()">

🔄 تحديث

</button>

</div>

<div style="margin-bottom:15px">
<input
id="searchOrders"
type="text"
placeholder="🔎 ابحث بالاسم أو رقم الطلب أو الهاتف..."
oninput="filterOrders()"
style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px"
>
</div>

<div id="orders">

<div class="empty">
جاري تحميل الطلبات...
</div>

</div>

</div>

`;

}


async function loadOrders(){

const ordersBox=
document.getElementById("orders");


if(!ordersBox){
return;
}


ordersBox.innerHTML=`

<div class="empty">
جاري تحميل الطلبات...
</div>

`;


const {
data:orders,
error
}=await supabaseClient
.from("orders")
.select("*")
.order("created_at",{ascending:false});


if(error){

console.error(error);

ordersBox.innerHTML=`

<div class="error">
حدث خطأ أثناء تحميل الطلبات.
<br>
${escapeHtml(error.message)}
</div>

`;

return;

}


document.getElementById("ordersCount")
.textContent=orders.length;


if(orders.length===0){

document.getElementById("lastTotal")
.textContent="0 $";

document.getElementById("lastCountry")
.textContent="-";


ordersBox.innerHTML=`

<div class="empty">

📭 لا توجد طلبات حتى الآن.

</div>

`;

return;

}


const last=orders[0];


document.getElementById("lastTotal")
.textContent=
Number(last.total_usd || 0).toFixed(2)+" $";


document.getElementById("lastCountry")
.textContent=
COUNTRIES[last.country]?.name ||
last.country ||
"-";


ordersBox.innerHTML=
orders.map(renderOrder).join("");

}


function renderOrder(order){

const date=
order.created_at
?
new Date(order.created_at)
.toLocaleString("ar-EG")
:
"—";


const country=
COUNTRIES[order.country] ||
{
name:order.country || "-",
symbol:""
};


const status=
order.status || "pending";


return `

<div class="order">

<div class="row">

<h3>

📦

${escapeHtml(
order.order_number || "بدون رقم"
)}

</h3>


<div>

<span class="badge">

${escapeHtml(date)}

</span>

<select class="statusSelect"
onchange="updateStatus(${Number(order.id)},this.value)">

<option value="pending" ${status==="pending"?"selected":""}>
⏳ قيد الانتظار
</option>

<option value="contacted" ${status==="contacted"?"selected":""}>
📞 تم التواصل
</option>

<option value="processing" ${status==="processing"?"selected":""}>
⚙️ جاري التجهيز
</option>

<option value="shipped" ${status==="shipped"?"selected":""}>
🚚 تم الشحن
</option>

<option value="completed" ${status==="completed"?"selected":""}>
✅ مكتمل
</option>

<option value="cancelled" ${status==="cancelled"?"selected":""}>
❌ ملغي
</option>

</select>

</div>

</div>


<p>

👤

<strong>
الاسم:
</strong>

${escapeHtml(
order.customer_name
)}

</p>


<p>

📱

<strong>
الهاتف:
</strong>

${escapeHtml(
order.customer_phone
)}

</p>


<p>

📧

<strong>
البريد:
</strong>

${escapeHtml(
order.customer_email || "غير موجود"
)}

</p>


<p>

🌍

<strong>
الدولة:
</strong>

${escapeHtml(
country.name
)}

</p>


<p>

📍

<strong>
العنوان:
</strong>

${escapeHtml(
order.shipping_address
)}

</p>


<p>

💵

<strong>
العملة:
</strong>

${escapeHtml(
order.currency
)}

</p>


<p>

💰

<strong>
الإجمالي بالدولار:
</strong>

${Number(
order.total_usd || 0
).toFixed(2)}

$

</p>


<p>

🧾

<strong>
رقم قاعدة البيانات:
</strong>

${escapeHtml(
order.id
)}

</p>


<div style="margin-top:15px">

<button
class="whatsappBtn"
onclick='openWhatsApp(${JSON.stringify(String(order.customer_phone||""))})'>
💬 واتساب
</button>
<button
class="clear"
onclick="deleteOrder(${Number(order.id)})">

🗑️ حذف الطلب

</button>

</div>


</div>

`;

}

function openWhatsApp(phone){

let p=String(phone||"").replace(/\D/g,"");

if(p.startsWith("0")){
p="20"+p.slice(1);
}

window.open("https://wa.me/"+p,"_blank");

}
async function updateStatus(id,status){

const {error}=await supabaseClient
.from("orders")
.update({
status:status,
updated_at:new Date().toISOString()
})
.eq("id",id);

if(error){

alert("حدث خطأ أثناء تحديث حالة الطلب: "+error.message);

await loadOrders();

return;

}

await loadOrders();

}

function filterOrders(){

let input=document.getElementById("searchOrders");

let query=input.value.toLowerCase().trim();

let orderElements=document.querySelectorAll(".order");

orderElements.forEach(order=>{

let text=order.innerText.toLowerCase();

if(text.includes(query)){
order.style.display="";
}else{
order.style.display="none";
}

});

}
async function deleteOrder(id){

if(!confirm(
"هل أنت متأكد من حذف هذا الطلب؟"
)){

return;

}


const {
error
}=await supabaseClient
.from("orders")
.delete()
.eq("id",id);


if(error){

alert(
"حدث خطأ أثناء حذف الطلب: "+
error.message
);

return;

}


await loadOrders();

}


async function logoutAdmin(){

await supabaseClient.auth.signOut();

showLogin();

}


async function startAdmin(){

const {
data:{
session
}
}=await supabaseClient.auth.getSession();


if(session){

await checkAdmin();

}else{

showLogin();

}

}


startAdmin();

</script>

</body>

</html>
